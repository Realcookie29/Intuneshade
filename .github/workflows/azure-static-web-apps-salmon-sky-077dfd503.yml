name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Least privilege for the GITHUB_TOKEN (the deploy action comments preview URLs on PRs).
permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Build frontend → dist/
      # Tests gate the deploy: a failing test never reaches production.
      - name: Install, test and build frontend
        run: npm ci && npm test && npm run build

      # SWA config must live inside the static folder
      - name: Copy SWA config into dist
        run: cp staticwebapp.config.json dist/

      # Remove root node_modules so Oryx doesn't count them as static files
      - name: Clean root node_modules
        run: rm -rf node_modules

      # app_location: pre-built dist/ (no package.json → plain static site, correct MIME types)
      # api_location: api/ → Oryx installs dependencies (npm install) then runs npm run build (tsc)
      # All SDK deps are in "dependencies" so Oryx installs them in production mode.
      # typescript is also in "dependencies" so Oryx can run tsc.
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_SKY_077DFD503 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          output_location: "."

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_SKY_077DFD503 }}
          action: "close"
